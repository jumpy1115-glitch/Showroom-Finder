<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--surface:#FFFDF9;--beige:#EDE4D6;--line:#E0D5C3;--ink:#2B2B27;--mute:#6B675E;--green:#5F7565;--green-d:#3E5345;--on-green:#fff;--green-l:#DCE6DC;--amber:#7A5B2E;--amber-l:#F1E4CC;--grey-l:#ECE8E1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E211D;--surface:#262A25;--beige:#2E322C;--line:#3A3F38;--ink:#ECE8DF;--mute:#A39F94;--green:#8FA896;--green-d:#A9C1AF;--on-green:#1E211D;--green-l:#2D3A31;--amber:#D2B27A;--amber-l:#3B3222;--grey-l:#30332E}}
:root[data-theme="dark"]{--bg:#1E211D;--surface:#262A25;--beige:#2E322C;--line:#3A3F38;--ink:#ECE8DF;--mute:#A39F94;--green:#8FA896;--green-d:#A9C1AF;--on-green:#1E211D;--green-l:#2D3A31;--amber:#D2B27A;--amber-l:#3B3222;--grey-l:#30332E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{font-weight:600;text-decoration:none;letter-spacing:.01em}
nav{display:flex;gap:4px}
nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--mute);font-size:15px}
nav a[aria-current=page]{background:var(--green-l);color:var(--green-d);font-weight:500}
h1{font-weight:300;font-size:clamp(34px,6vw,60px);line-height:1.08;letter-spacing:-.02em;margin:0 0 16px;max-width:14em}
h2{font-weight:500;font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-weight:500;font-size:17px;margin:0}
.lead{color:var(--mute);max-width:36em;margin:0 0 24px;font-size:18px}
.hero{padding:56px 0 36px;display:grid;gap:32px}
.search{display:flex;gap:8px;max-width:520px}
input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-height:44px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--green-d);background:var(--green-d);color:var(--on-green);text-decoration:none;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--green-d)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.pill[aria-pressed=true]{background:var(--green-d);color:var(--on-green);border-color:var(--green-d)}
.note{background:var(--amber-l);color:var(--amber);border-radius:12px;padding:14px 18px;font-size:14.5px;margin:0 0 28px}
.note b{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 48px}
.stat{padding:22px 0}
.stat b{display:block;font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--mute);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:48px}
.tile{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;cursor:pointer;width:100%}
.tile:hover{border-color:var(--green)}
.tile small{color:var(--mute);display:block;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 12px;align-items:center}
.bar>*{flex:1 1 160px}.bar .grow{flex:2 1 240px}
.count{color:var(--mute);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}
.card:hover{border-color:var(--green)}
.meta{color:var(--mute);font-size:14px}
.chip{display:inline-block;align-self:flex-start;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500}
.chip.Displayed{background:var(--green-l);color:var(--green-d)}
.chip.Removed{background:var(--amber-l);color:var(--amber)}
.chip.none{background:var(--grey-l);color:var(--mute)}
.split{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.split{grid-template-columns:340px minmax(0,1fr);align-items:start}.panel{position:sticky;top:76px}}
.list{display:flex;flex-direction:column;gap:8px}
.sbtn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.sbtn[aria-pressed=true]{border-color:var(--green-d);background:var(--green-l)}
.sbtn small{display:block;color:var(--mute)}
.metro{font-weight:500;margin:20px 0 8px;color:var(--green-d)}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.rec header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:0;font-size:15px}
dt{color:var(--mute)}dd{margin:0}
.tag{display:inline-block;background:var(--beige);border-radius:6px;padding:2px 8px;font-size:13px;margin:0 6px 4px 0}
.crumb{display:inline-block;margin:28px 0 8px;color:var(--mute);font-size:14px;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--mute);text-align:center}
footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0 40px;color:var(--mute);font-size:13.5px}
footer p{max-width:60em;margin:0 0 8px}
@media(max-width:560px){.top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-direction:column;align-items:flex-start}nav a{padding:7px 10px;font-size:14px}dl{grid-template-columns:90px 1fr}.hero{padding-top:36px}}
@media(prefers-reduced-motion:no-preference){.card,.tile,.sbtn{transition:border-color .15s}}
</style>
</head>

      h("select",{"aria-label":"Brand",value:brand,onChange:e=>setBrand(e.target.value)},h("option",{value:""},"All brands"),brands.map(b=>h("option",{key:b},b)))),
    h("div",{className:"count"},rows.length+" of "+S.length+" stores"),
    h("div",{className:"split"},
      h("div",{className:"list"},rows.length?metros.filter(m=>rows.some(s=>s.Metro_Area===m)).map(m=>h("div",{key:m},h("div",{className:"metro"},m),
        rows.filter(s=>s.Metro_Area===m).map(s=>h("button",{key:s.StoreId,className:"sbtn","aria-pressed":sel===s.StoreId,style:{marginBottom:8},onClick:()=>{setSel(s.StoreId);setSt("")}},
          s.Store_Name,h("small",null,s.Municipality+" · "+(dS[s.Key]||[]).length+" display records"))))):h("div",{className:"empty"},"No stores match. Clear a filter or change the search.")),
      h("div",{className:"panel"},cur?h("div",null,
        h("h2",null,cur.Store_Name),

        h("div",{className:"bar",style:{margin:"12px 0"}},h("select",{"aria-label":"Status",value:st,onChange:e=>setSt(e.target.value)},h("option",{value:""},"All statuses"),h("option",null,"Displayed"),h("option",null,"Removed"))),
        h("div",{className:"count"},recs.length+" display record"+(recs.length===1?"":"s")),

}
function Detail({id,go}){
  const p=pById[id];
  if(!p)return h("main",{className:"wrap"},h("div",{className:"empty",style:{marginTop:40}},"Product not found."),h("button",{className:"crumb",onClick:()=>go("products")},"Back to products"));
  const r=dP[id]||[],s=statusOf(id);
  const sorted=[...r].sort((a,b)=>(a.Display_Status==="Displayed"?0:1)-(b.Display_Status==="Displayed"?0:1));
  return h("main",{className:"wrap"},
    h("button",{className:"crumb",onClick:()=>history.length>1?history.back():go("products")},"Back to products"),
    h("section",{style:{padding:"8px 0 24px"}},
      h("div",{className:"meta"},p.Brand+" · "+p.ProductCategory+" · "+p.ProductId),
      h("h1",{style:{fontSize:"clamp(32px,6vw,52px)",margin:"6px 0 14px"}},p.ProductName),
      h(Chip,{s}),
      h("div",{style:{marginTop:20}},h("a",{className:"btn",href:p.Product_URL,target:"_blank",rel:"noopener noreferrer"},"View on Official Website ↗"))),
    h("p",{className:"note"},"Synthetic demonstration data. These records are not verified real-world availability."),
    h("h2",null,"Showroom display records ("+r.length+")"),
    r.length?sorted.map(d=>h(Rec,{key:d.DisplayId,d,mode:"product"})):h("div",{className:"empty"},NONE+". This product has no showroom display record in the dataset."));
}
function App(){
  const [route,setRoute]=useState(hashRoute());
  const [pf,setPf]=useState({q:"",brand:"",cat:"",st:""});
  const [metro,setMetro]=useState("");
  useEffect(()=>{const f=()=>{setRoute(hashRoute());window.scrollTo(0,0)};window.addEventListener("hashchange",f);return()=>window.removeEventListener("hashchange",f)},[]);
  const go=(r,m)=>{if(r==="stores")setMetro(m||"");location.hash=r;setRoute(r);window.scrollTo(0,0)};
  const pid=/^P\d+$/.test(route)?route:null;
  const cur=pid?"products":route;
  const page=pid?h(Detail,{id:pid,go}):route==="products"?h(Products,{pf,setPf}):route==="stores"?h(Stores,{init:metro}):h(Home,{go,setPf});
  return h(React.Fragment,null,
    h("header",{className:"top"},h("div",{className:"wrap"},
      h("a",{className:"brand",href:"#home"},"Showroom Finder"),
      h("nav",{"aria-label":"Main"},[["home","Home"],["products","Products"],["stores","Stores"]].map(([k,l])=>h("a",{key:k,href:"#"+k,"aria-current":(cur===k||(k==="home"&&!["products","stores"].includes(cur)))?"page":undefined},l))))),
    page,
    h("footer",null,h("div",{className:"wrap"},
      h("p",null,h("b",null,"Disclaimer: "),"The showroom display dataset is synthetic demonstration data, not verified real-world availability. This app does not show or infer stock levels."),
      h("p",null,"Display records join to stores by StoreId. Store.csv lists numeric IDs (1–29) while Store_Display.csv uses keys such as IKEA001, Mio001 and Chilli001; they are matched by brand and row order within each brand. All original IDs are kept."))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
